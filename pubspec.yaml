name: flutter_enterprise_pos
description: Production-ready POS dashboard with Clean Architecture, offline-first sync, and real-time analytics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.8.0
  get_it: ^8.0.0
  injectable: ^2.5.0
  connectivity_plus: ^6.1.0
  fl_chart: ^0.69.0
  google_fonts: ^6.3.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  iconsax: ^0.0.8
  intl: ^0.19.0
  uuid: ^4.5.1
  dartz: ^0.10.1
  rxdart: ^0.28.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  injectable_generator: ^2.6.2
  mockito: ^5.4.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/